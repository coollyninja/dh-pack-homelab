schema_version: 1
id: dh-pack-homelab
name: Homelab Observability
version: 0.4.0
description: Topology-neutral service, virtualization, metrics, and tailnet observability.
requires:
  - plugin: dh-http-status
    version: 0.1.0
  - plugin: dh-proxmox
    version: 0.1.0
  - plugin: dh-prometheus
    version: 0.1.0
  - plugin: dh-tailscale
    version: 0.1.0
profiles:
  - id: homelab-observability
    path: profiles/homelab-observability.yaml
configuration:
  plugin_config: config/plugins.example.yaml
  plugin_lock: config/plugins.lock.example.yaml
  policy_inventory: policy/inventory.example.json
