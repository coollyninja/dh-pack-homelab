schema_version: 1
plugins:
  dh-core:
    enabled: true
    config: {}
  dh-http-status:
    enabled: true
    config:
      endpoints:
        automation:
          base_url: https://automation.example.invalid
          health_path: /health
          verify_tls: true
          stale_after_seconds: 30
        metrics:
          base_url: https://metrics.example.invalid
          health_path: /-/ready
          verify_tls: true
          stale_after_seconds: 30
        network:
          base_url: https://network.example.invalid
          health_path: /health
          verify_tls: true
          stale_after_seconds: 30
  dh-proxmox:
    enabled: true
    config:
      endpoint: https://proxmox.example.invalid:8006
      token_id_file: /run/secrets/deckhand/proxmox-token-id
      token_secret_file: /run/secrets/deckhand/proxmox-token-secret
      verify_tls: true
      ca_file: /run/secrets/deckhand/proxmox-ca.pem
      timeout_seconds: 5
      targets:
        virtualization_cluster:
          kind: cluster
          stale_after_seconds: 30
  dh-prometheus:
    enabled: true
    runtime:
      timeout_seconds: 8
      max_concurrency: 4
      requests_per_second: 10
      burst: 10
      failure_threshold: 3
      recovery_seconds: 30
    config:
      endpoint: https://prometheus.example.invalid
      bearer_token_file: /run/secrets/deckhand/prometheus-token
      verify_tls: true
      ca_file: /run/secrets/deckhand/prometheus-ca.pem
      timeout_seconds: 5
      checks:
        monitoring_availability:
          kind: scalar
          expression: scalar(sum(up) > 0)
          operator: eq
          threshold: 1
          stale_after_seconds: 30
        critical_alerts:
          kind: alerts
          match_labels:
            severity: critical
          stale_after_seconds: 30
        scrape_targets:
          kind: targets
          stale_after_seconds: 30
